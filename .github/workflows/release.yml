name: Release

# A pushed tag vX.Y.Z runs the same checks as CI, then publishes static Linux
# binaries (no CGO, Linux amd64/arm64 and Windows amd64) with SHA256SUMS on the GitHub release for that tag.
# Release notes come from three places, first match wins:
# notes/<tag>.md if it exists, the tag's section in CHANGELOG.md if it has
# one, otherwise GitHub's auto-generated notes.
# A tag with a pre-release label (v0.4.0-rc.1) publishes as a GitHub
# pre-release. GitHub never returns a pre-release as releases/latest, so the
# README's download link and `berth update` stay on the last release. Its
# notes are CHANGELOG.md's Unreleased section, from the branch it was cut on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - name: Check
        run: |
          go build ./...
          test -z "$(gofmt -l .)"
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o dist/berth-linux-$arch ./cmd/berth
          done
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/berth-windows-amd64.exe ./cmd/berth
          cd dist && sha256sum berth-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              awk '/^## \[Unreleased\]/ { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > prerelease-notes.md
              {
                echo "A pre-release for testing. Production installs stay on the latest release; \`berth update\` never offers a pre-release."
                echo
                cat prerelease-notes.md
              } > prerelease-body.md
              gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Berth ${GITHUB_REF_NAME}" --notes-file prerelease-body.md
              exit 0
              ;;
          esac
          if [ -f "notes/${GITHUB_REF_NAME}.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Berth ${GITHUB_REF_NAME}" --notes-file "notes/${GITHUB_REF_NAME}.md"
            exit 0
          fi
          if [ -f CHANGELOG.md ]; then
            awk -v tag="${GITHUB_REF_NAME}" '
              $0 ~ "^## \\[" tag "\\] " || $0 == "## [" tag "]" { on = 1; next }
              on && /^## / { exit }
              on' CHANGELOG.md > release-from-changelog.md
            if [ -s release-from-changelog.md ]; then
              gh release create "$GITHUB_REF_NAME" dist/* --title "Berth ${GITHUB_REF_NAME}" --notes-file release-from-changelog.md
              exit 0
            fi
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
