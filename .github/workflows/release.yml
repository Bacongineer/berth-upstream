name: Release

# A pushed tag vX.Y.Z runs the same checks as CI, then publishes static Linux
# binaries (no CGO) with SHA256SUMS on the GitHub release for that tag.
# Release notes come from notes/<tag>.md if that file exists, otherwise GitHub's auto-generated notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - name: Check
        run: |
          go build ./...
          test -z "$(gofmt -l .)"
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o dist/berth-linux-$arch ./cmd/berth
          done
          cd dist && sha256sum berth-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "notes/${GITHUB_REF_NAME}.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Berth ${GITHUB_REF_NAME}" --notes-file "notes/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
