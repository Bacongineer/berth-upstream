<text x="108" y="409" class="s" font-size="16" font-weight="600" fill="#f0f5fa">A game launches</text>
<text x="108" y="430" class="m" font-size="12.5" fill="#8ba0b8">claim → hold the card</text>
<path class="flow" d="M342 413C372 413 378 270 404 270" fill="none" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/>
