<text x="108" y="352" class="m" font-size="12.5" fill="#8ba0b8">berth run -- llama-server</text>
<path class="flow" d="M342 335C372 335 378 270 404 270" fill="none" stroke="#7ad4f2" stroke-opacity=".7" stroke-width="2"/>
