<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">How berth works</title>
<desc id="d">Clients ask berth for the GPU: a chat agent through the gateway, a ComfyUI workflow, an engine under berth run, a game. berthd queues them by priority, drains the holder at its request or job boundary, waits for the driver to show the memory free, then grants the lease and starts the next engine. A timeline of one 24 GiB card shows llama-swap, strata, a game and ComfyUI taking turns with no overlap.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#070c13"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ad4f2"/></marker>
  <marker id="arDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d7ea6"/></marker>

<linearGradient id="gcy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ad4f2" stop-opacity=".55"/><stop offset="1" stop-color="#7ad4f2" stop-opacity=".08"/></linearGradient>
<linearGradient id="gpe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa8ff" stop-opacity=".55"/><stop offset="1" stop-color="#9aa8ff" stop-opacity=".08"/></linearGradient>
<linearGradient id="gma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity=".55"/><stop offset="1" stop-color="#fb7185" stop-opacity=".08"/></linearGradient>
<linearGradient id="gam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b56f" stop-opacity=".55"/><stop offset="1" stop-color="#e8b56f" stop-opacity=".08"/></linearGradient>
<style>
  .m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace} .s{font-family:system-ui,-apple-system,'Segoe UI',Inter,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
  .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .head{animation:play 14s linear infinite}
  @keyframes play{from{transform:translateX(0)}to{transform:translateX(1060px)}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
