<text x="40" y="52" class="m" font-size="13" letter-spacing="3" fill="#e8b56f">HOW BERTH WORKS</text>
<text x="40" y="84" class="s" font-size="25" font-weight="600" fill="#f0f5fa">Everything asks for the card. Berth hands it over only when it is safe.</text>
<text x="40" y="130" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">WHO ASKS</text>
<text x="410" y="130" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">BERTHD · THE HARBOR MASTER</text>
<text x="890" y="130" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">ONE CARD</text>
<rect x="40" y="148" width="300" height="62" rx="10" fill="#111b28" stroke="#243549"/>
<rect x="40" y="148" width="4" height="62" rx="2" fill="#9aa8ff"/>
