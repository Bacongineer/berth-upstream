<text x="472" y="240" class="s" font-size="16" font-weight="600" fill="#f0f5fa">Drain the holder at its boundary</text>
<text x="472" y="261" class="m" font-size="12.5" fill="#8ba0b8">reply finished · ComfyUI job done · slots idle</text>
<line x1="444" y1="260" x2="444" y2="286" stroke="#7ad4f2" stroke-opacity=".35" stroke-width="1.5"/>
<circle cx="444" cy="304" r="15" fill="#132a3c" stroke="#7ad4f2" stroke-width="1.6"/>
<text x="444" y="309" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#7ad4f2">3</text>
<text x="472" y="300" class="s" font-size="16" font-weight="600" fill="#f0f5fa">Wait for the driver</text>
<text x="472" y="321" class="m" font-size="12.5" fill="#8ba0b8">grant only when the memory shows free</text>
<line x1="444" y1="320" x2="444" y2="346" stroke="#7ad4f2" stroke-opacity=".35" stroke-width="1.5"/>
<circle cx="444" cy="364" r="15" fill="#132a3c" stroke="#7ad4f2" stroke-width="1.6"/>
<text x="444" y="369" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#7ad4f2">4</text>
<text x="472" y="360" class="s" font-size="16" font-weight="600" fill="#f0f5fa">Grant the lease, start the engine</text>
<text x="472" y="381" class="m" font-size="12.5" fill="#8ba0b8">the request streams; nobody crashed</text>
<rect x="426" y="410" width="388" height="22" rx="11" fill="#1d1420" stroke="#6b2b3a"/>
<text x="620.0" y="425" text-anchor="middle" class="m" font-size="11" fill="#ffc2cb">stowaways (VRAM without a lease): reported, never killed</text>
