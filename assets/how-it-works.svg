<text x="472" y="180" class="s" font-size="16" font-weight="600" fill="#f0f5fa">Queue by priority</text>
<text x="472" y="201" class="m" font-size="12.5" fill="#8ba0b8">hold › foreground › interactive › batch</text>
<line x1="444" y1="200" x2="444" y2="226" stroke="#7ad4f2" stroke-opacity=".35" stroke-width="1.5"/>
